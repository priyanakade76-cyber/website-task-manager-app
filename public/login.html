<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | TaskFlow</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">

  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 30%, rgba(99, 102, 241, 0.12) 0%, transparent 70%);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      padding: 38px 34px;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-header h1 {
      font-size: 1.75rem;
      margin-top: 14px;
      margin-bottom: 6px;
    }
    .auth-header p {
      color: var(--text-muted);
      font-size: 0.88rem;
    }
    .password-wrapper {
      position: relative;
    }
    .pwd-toggle-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 0.95rem;
    }
    .pwd-toggle-btn:hover {
      color: var(--text-main);
    }
    .auth-divider {
      display: flex;
      align-items: center;
      margin: 22px 0;
      color: var(--text-dim);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .auth-divider::before, .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-subtle);
    }
    .auth-divider span {
      padding: 0 12px;
    }
    .demo-login-box {
      background: rgba(99, 102, 241, 0.08);
      border: 1px dashed rgba(99, 102, 241, 0.4);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="card auth-card">
      <div class="auth-header">
        <a href="/" class="brand-logo" style="justify-content: center;">
          <div class="brand-icon"><i class="fa-solid fa-bolt"></i></div>
          <span>TaskFlow</span>
        </a>
        <h1>Welcome Back</h1>
        <p>Sign in to your productivity workspace</p>
      </div>

      <!-- Quick Demo Access -->
      <div class="demo-login-box">
        <p style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 8px;">
          Want to explore right away?
        </p>
        <button type="button" class="btn-secondary" id="btn-demo-login" style="width: 100%; justify-content: center; font-size: 0.84rem;">
          <i class="fa-solid fa-wand-magic-sparkles" style="color: var(--primary);"></i> One-Click Demo Login
        </button>
      </div>

      <div class="auth-divider">
        <span>Or continue with email</span>
      </div>

      <!-- Error Alert -->
      <div id="auth-error-alert" style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444; padding: 12px; border-radius: var(--radius-md); font-size: 0.85rem; margin-bottom: 20px;">
        <i class="fa-solid fa-circle-exclamation"></i> <span id="auth-error-msg"></span>
      </div>

      <form id="form-login">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-input" placeholder="name@example.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="pwd-toggle-btn" id="btn-toggle-pwd">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="btn-submit-login" style="width: 100%; justify-content: center; padding: 12px; font-size: 0.95rem; margin-top: 10px;">
          <i class="fa-solid fa-right-to-bracket"></i> Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.85rem; color: var(--text-muted);">
        Don't have an account? <a href="/register.html" style="color: var(--primary); font-weight: 600;">Sign up</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    const form = document.getElementById('form-login');
    const emailInput = document.getElementById('login-email');
    const pwdInput = document.getElementById('login-password');
    const errorAlert = document.getElementById('auth-error-alert');
    const errorMsg = document.getElementById('auth-error-msg');
    const togglePwdBtn = document.getElementById('btn-toggle-pwd');
    const demoBtn = document.getElementById('btn-demo-login');

    // Toggle Password Visibility
    togglePwdBtn.addEventListener('click', () => {
      const isPwd = pwdInput.type === 'password';
      pwdInput.type = isPwd ? 'text' : 'password';
      togglePwdBtn.querySelector('i').className = isPwd ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
    });

    // Login Form Submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';

      try {
        await API.auth.login(emailInput.value.trim(), pwdInput.value);
        showToast('Success', 'Welcome back!', 'success');
        window.location.href = '/dashboard.html';
      } catch (err) {
        errorMsg.textContent = err.message;
        errorAlert.style.display = 'block';
        showToast('Login Failed', err.message, 'error');
      }
    });

    // Demo Account One-Click Login
    demoBtn.addEventListener('click', async () => {
      errorAlert.style.display = 'none';
      const demoEmail = 'demo@taskflow.com';
      const demoPassword = 'Password123!';

      try {
        // Try login
        await API.auth.login(demoEmail, demoPassword);
        window.location.href = '/dashboard.html';
      } catch (err) {
        // If not registered yet, auto-register demo user
        try {
          await API.auth.register('Alex Morgan (Demo)', demoEmail, demoPassword);
          // Seed sample tasks for demo user
          await seedDemoTasks();
          window.location.href = '/dashboard.html';
        } catch (regErr) {
          errorMsg.textContent = regErr.message;
          errorAlert.style.display = 'block';
        }
      }
    });

    async function seedDemoTasks() {
      try {
        const today = new Date();
        const tomorrow = new Date(today);
        tomorrow.setDate(today.getDate() + 1);

        const sampleTasks = [
          {
            title: 'Design high-converting Landing Page hero section',
            description: 'Refine typography, vibrant gradients and call-to-action buttons.',
            status: 'In Progress',
            priority: 'High',
            dueDate: today.toISOString(),
            dueTime: '15:00',
            tags: ['design', 'ui', 'marketing'],
            estimatedTime: 120
          },
          {
            title: 'Implement REST API unit & integration tests',
            description: 'Verify JWT auth tokens, status updates, and category filtering.',
            status: 'Completed',
            priority: 'Urgent',
            dueDate: today.toISOString(),
            dueTime: '11:00',
            tags: ['backend', 'testing', 'security'],
            estimatedTime: 90
          },
          {
            title: 'Conduct weekly productivity sprint review',
            description: 'Review Chart.js completion stats and plan upcoming milestone tasks.',
            status: 'Todo',
            priority: 'Medium',
            dueDate: tomorrow.toISOString(),
            dueTime: '17:00',
            tags: ['sprint', 'planning'],
            estimatedTime: 45
          },
          {
            title: 'Read 20 pages of Clean Architecture book',
            description: 'Focus on boundary layers and dependency inversion principles.',
            status: 'Todo',
            priority: 'Low',
            dueDate: tomorrow.toISOString(),
            dueTime: '20:00',
            tags: ['study', 'reading'],
            estimatedTime: 30,
            recurring: { isRecurring: true, frequency: 'Daily', intervalDays: 1 }
          }
        ];

        for (const task of sampleTasks) {
          await API.tasks.create(task);
        }
      } catch (e) {
        console.error('Demo seed error:', e);
      }
    }
  </script>
</body>
</html>
